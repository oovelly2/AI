<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>별자리 운세</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a1a;
      color: #fff;
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* 별 배경 */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite alternate;
      opacity: 0.6;
    }
    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(0.8); }
      to   { opacity: 1;   transform: scale(1.3); }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    header {
      text-align: center;
    }
    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c9a2ff, #7eb8ff, #ffe4a2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    header p {
      color: #a0a0c0;
      font-size: 0.95rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 30px 28px;
      width: 100%;
      backdrop-filter: blur(12px);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-group label {
      font-size: 0.9rem;
      color: #b0b0d0;
      letter-spacing: 0.04em;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input[type="number"] {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .input-row input[type="number"]::-webkit-inner-spin-button { display: none; }
    .input-row input[type="number"]:focus {
      border-color: #9b7fff;
    }
    .input-row input::placeholder { color: #555577; }
    .input-row span {
      color: #9090b0;
      align-self: center;
      font-size: 1.1rem;
    }

    button#findBtn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7b2fff, #2f8fff);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.03em;
    }
    button#findBtn:hover  { opacity: 0.88; transform: translateY(-1px); }
    button#findBtn:active { transform: translateY(1px); }

    /* 결과 카드 */
    #result {
      display: none;
      width: 100%;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sign-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .sign-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .sign-name {
      font-size: 1.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d4aaff, #7fcfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sign-period {
      color: #8080aa;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .sign-traits {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .trait-tag {
      background: rgba(155,127,255,0.15);
      border: 1px solid rgba(155,127,255,0.3);
      color: #c8b0ff;
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 0.8rem;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 20px 0;
    }

    .fortune-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .fortune-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }
    .fortune-item .fi-label {
      font-size: 0.75rem;
      color: #7070a0;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    .fortune-item .fi-value {
      font-size: 1rem;
      font-weight: 600;
    }
    .stars-row {
      color: #f5c518;
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    .fortune-today {
      background: rgba(123,47,255,0.1);
      border: 1px solid rgba(123,47,255,0.25);
      border-radius: 14px;
      padding: 18px;
    }
    .fortune-today h3 {
      font-size: 0.82rem;
      color: #9b7fff;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .fortune-today p {
      font-size: 0.97rem;
      line-height: 1.75;
      color: #d8d8f0;
    }

    .lucky-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .lucky-item {
      flex: 1;
      min-width: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .lucky-item .li-label {
      font-size: 0.72rem;
      color: #7070a0;
      margin-bottom: 4px;
    }
    .lucky-item .li-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e0d0ff;
    }

    .retry-btn {
      display: block;
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #9090b0;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 20px;
      transition: border-color 0.2s, color 0.2s;
    }
    .retry-btn:hover { border-color: #9b7fff; color: #c8b0ff; }

    footer {
      position: relative;
      z-index: 1;
      color: #40405a;
      font-size: 0.75rem;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="stars" id="starsContainer"></div>

<main>
  <header>
    <h1>✨ 별자리 운세</h1>
    <p>생일을 입력하면 오늘의 운세를 알려드려요</p>
  </header>

  <div class="card">
    <div class="input-group">
      <label>생일 (월/일)</label>
      <div class="input-row">
        <input type="number" id="monthInput" placeholder="월" min="1" max="12" />
        <span>월</span>
        <input type="number" id="dayInput" placeholder="일" min="1" max="31" />
        <span>일</span>
      </div>
    </div>
    <div style="height:18px"></div>
    <button id="findBtn" onclick="findZodiac()">운세 보기 🔮</button>
  </div>

  <div id="result">
    <div class="card">
      <div class="sign-header">
        <span class="sign-emoji" id="signEmoji"></span>
        <div class="sign-name" id="signName"></div>
        <div class="sign-period" id="signPeriod"></div>
        <div class="sign-traits" id="signTraits"></div>
      </div>

      <div class="divider"></div>

      <div class="fortune-grid">
        <div class="fortune-item">
          <div class="fi-label">전체운</div>
          <div class="fi-value stars-row" id="starOverall"></div>
        </div>
        <div class="fortune-item">
          <div class="fi-label">애정운</div>
          <div class="fi-value stars-row" id="starLove"></div>
        </div>
        <div class="fortune-item">
          <div class="fi-label">금전운</div>
          <div class="fi-value stars-row" id="starMoney"></div>
        </div>
        <div class="fortune-item">
          <div class="fi-label">건강운</div>
          <div class="fi-value stars-row" id="starHealth"></div>
        </div>
      </div>

      <div class="fortune-today">
        <h3>✦ 오늘의 운세</h3>
        <p id="fortuneText"></p>
      </div>

      <div class="lucky-row">
        <div class="lucky-item">
          <div class="li-label">행운의 색</div>
          <div class="li-value" id="luckyColor"></div>
        </div>
        <div class="lucky-item">
          <div class="li-label">행운의 숫자</div>
          <div class="li-value" id="luckyNumber"></div>
        </div>
        <div class="lucky-item">
          <div class="li-label">주의할 시간</div>
          <div class="li-value" id="luckyTime"></div>
        </div>
      </div>

      <button class="retry-btn" onclick="reset()">← 다시 입력하기</button>
    </div>
  </div>
</main>

<footer>재미로 보는 운세입니다 🌙</footer>

  function getSign(month, day) {
    if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return 0;
    if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return 1;
    if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return 2;
    if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return 3;
    if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return 4;
    if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return 5;
    if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return 6;
    if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return 7;
    if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return 8;
    if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return 9;
    if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return 10;
    if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return 11;
    return 0;
  }

  function starsHtml(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  // 날짜 기반 시드로 운세 결정 (오늘 날짜 + 별자리)
  function seededRand(seed) {
    let x = Math.sin(seed + 1) * 10000;
    return x - Math.floor(x);
  }

  function findZodiac() {
    const month = parseInt(document.getElementById('monthInput').value);
    const day   = parseInt(document.getElementById('dayInput').value);

    if (!month || !day || month < 1 || month > 12 || day < 1 || day > 31) {
      alert('올바른 월과 일을 입력해 주세요!');
      return;
    }

    const idx  = getSign(month, day);
    const sign = SIGNS[idx];

    // 오늘 기준 시드
    const today = new Date();
    const seed  = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate() + idx * 37;

    const fortuneIdx = Math.floor(seededRand(seed)      * sign.fortunes.length);
    const colorIdx   = Math.floor(seededRand(seed + 1)  * sign.colors.length);
    const numIdx     = Math.floor(seededRand(seed + 2)  * sign.numbers.length);
    const timeIdx    = Math.floor(seededRand(seed + 3)  * sign.times.length);

    const overall = 2 + Math.floor(seededRand(seed + 10) * 4); // 2~5
    const love    = 1 + Math.floor(seededRand(seed + 11) * 5);
    const money   = 1 + Math.floor(seededRand(seed + 12) * 5);
    const health  = 2 + Math.floor(seededRand(seed + 13) * 4);

    document.getElementById('signEmoji').textContent  = sign.emoji;
    document.getElementById('signName').textContent   = sign.name;
    document.getElementById('signPeriod').textContent = sign.period;

    const traitsEl = document.getElementById('signTraits');
    traitsEl.innerHTML = sign.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');

    document.getElementById('starOverall').textContent = starsHtml(overall);
    document.getElementById('starLove').textContent    = starsHtml(love);
    document.getElementById('starMoney').textContent   = starsHtml(money);
    document.getElementById('starHealth').textContent  = starsHtml(health);

    document.getElementById('fortuneText').textContent  = sign.fortunes[fortuneIdx];
    document.getElementById('luckyColor').textContent   = sign.colors[colorIdx];
    document.getElementById('luckyNumber').textContent  = sign.numbers[numIdx];
    document.getElementById('luckyTime').textContent    = sign.times[timeIdx];

    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function reset() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('monthInput').value = '';
    document.getElementById('dayInput').value   = '';
    document.getElementById('monthInput').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Enter 키 지원
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') findZodiac();
  });
</script>
